name: Portable packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: macos-15-intel
            target: macos-intel
          - runner: macos-15
            target: macos-apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build and smoke-test portable package
        run: python scripts/build_portable.py --platform ${{ matrix.target }}
      - name: Exercise GitHub runtime bootstrap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem -LiteralPath portable-dist -Filter '*.zip' -File | Select-Object -First 1
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'h-github-runtime-bootstrap'
          $env:H_FORCE_GITHUB_RUNTIME = '1'
          $env:H_RUNTIME_PACKAGE_PATH = $package.FullName
          $env:H_RUNTIME_PACKAGE_SHA256 = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
          scripts\h_run.cmd protocol mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $env:CODEX_HOME 'cache\h\github-runtime\portable-20260804034742\runtime\h_launcher.exe'))) { throw 'GitHub runtime launcher was not cached.' }
      - name: Exercise GitHub runtime bootstrap on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package=$(find portable-dist -maxdepth 1 -type f -name '*.zip' -print -quit)
          export CODEX_HOME="$RUNNER_TEMP/h-github-runtime-bootstrap"
          export H_FORCE_GITHUB_RUNTIME=1
          export H_RUNTIME_PACKAGE_PATH="$package"
          export H_RUNTIME_PACKAGE_SHA256=$(shasum -a 256 "$package" | awk '{print $1}')
          ./scripts/h_run.sh protocol mode
          test -x "$CODEX_HOME/cache/h/github-runtime/portable-20260804034742/runtime/h_launcher"
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: portable-dist/*.zip
          if-no-files-found: error
          retention-days: 30
