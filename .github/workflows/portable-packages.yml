name: Portable packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: macos-15-intel
            target: macos-intel
          - runner: macos-15
            target: macos-apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build and smoke-test portable package
        run: python scripts/build_portable.py --platform ${{ matrix.target }}
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: portable-dist/*.zip
          if-no-files-found: error
          retention-days: 30
