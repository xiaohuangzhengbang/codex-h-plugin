name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    env:
      CODEX_HOME: ${{ github.workspace }}/.h-ci-codex-home
      H_CI_BOOTSTRAP_TEST: "1"
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise first-use bootstrap
        run: python scripts/test_h_bootstrap_integration.py
      - name: Exercise fixed protocol
        run: python scripts/h_run.py protocol batch-image
      - name: Exercise Windows launcher
        if: runner.os == 'Windows'
        run: scripts\h_run.cmd start --offline
      - name: Exercise macOS launcher
        if: runner.os == 'macOS'
        run: ./scripts/h_run.sh start --offline
      - name: Validate macOS launcher syntax
        if: runner.os == 'macOS'
        run: sh -n scripts/h_run.sh
      - name: Run regression tests
        run: |
          python scripts/test_h_launcher.py
          python scripts/test_fastmoss_api.py
          python scripts/test_adspower_pipeline.py
          python scripts/test_kie_result_url.py
      - name: Validate AdsPower JavaScript runtime
        run: |
          node --check scripts/adspower_runtime/src/cli.mjs
          node --check scripts/adspower_runtime/src/publisher.mjs
          node --check scripts/adspower_runtime/src/tiktok-checker.mjs
      - name: Audit AdsPower Node dependencies
        working-directory: scripts/adspower_runtime
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate Python syntax
        run: python -m compileall -q scripts
      - name: Validate catalog without a Kie key
        run: python scripts/kie_video_batch.py catalog
      - name: Reject committed secrets
        shell: bash
        run: |
          if git grep -n -I -E '(sk-[A-Za-z0-9]{16,}|(^|[^a-f0-9])[a-f0-9]{32}([^a-f0-9]|$))' -- . ':!assets/*' ':!scripts/adspower_runtime/node_modules/**' ':!scripts/adspower_runtime/package-lock.json'; then
            echo "Potential API key committed"
            exit 1
          fi
